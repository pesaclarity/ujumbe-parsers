# yaml-language-server: $schema=../../schema/pack.schema.json
# Minimal starter pack. The message shape is illustrative and must be
# checked against real alerts (then rewritten as synthetic samples).
schema: 1
id: im_bank
name: I&M Bank
version: 0.1.0
currency: KES
utc_offset: "+03:00"
senders:
  - I&M
time_format: dd-MMM-yyyy HH:mm

rules:
  - id: account_alert
    type: bank
    direction_values:
      debited: out
      credited: in
    pattern: '^Dear Customer, your account (?<account>[\d*]+) has been (?<direction>debited|credited) with KES ?(?<amount>[\d,]+\.\d{2}) on (?<time>\d{2}-[A-Za-z]{3}-\d{4} \d{2}:\d{2})\. Ref: (?<receipt>[A-Z0-9]+)\. Avail\. bal KES ?(?<balance>[\d,]+\.\d{2})\.'
