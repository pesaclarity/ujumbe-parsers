      rule: payout
      type: withdrawal
      direction: out
      amount_minor: 100000
      currency: KES
      receipt: TJA0000047
      counterparty: JOHN DOE
      account: '0711000000'
      own_account: 000000M
      time: '2026-11-15T10:00:00+03:00'

  - name: a statement notice goes to the review inbox
