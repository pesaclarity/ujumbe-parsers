# Synthetic messages only.
pack: etica
samples:
  - name: withdraw from the fund to M-Pesa
    sender: ETICALTD
    received_at: '2026-11-14T11:11:00+03:00'
    body: "Dear esteemed client,\nYour payment of KES 400.00 to 0700000000 - JANE WANJIRU DOE  from account 000000M (EMMF - KES) has been processed successfully. Transaction ref: TJA0000035"
    expect:
      rule: payout
      type: withdrawal
      direction: out
      amount_minor: 40000
      currency: KES
      receipt: TJA0000035
      counterparty: JANE WANJIRU DOE
      account: '0700000000'
      own_account: 000000M
      time: '2026-11-14T11:11:00+03:00'

  - name: withdraw from the fund, on one line
    sender: ETICALTD
    received_at: '2026-11-15T10:00:00+03:00'
    body: 'Dear esteemed client, Your payment of KES 1,000.00 to 0711000000 - JOHN DOE from account 000000M (EMMF - KES) has been processed successfully. Transaction ref: TJA0000047'
