# yaml-language-server: $schema=../../schema/fixtures.schema.json
# Synthetic messages only: fake names, masked fake numbers, made-up receipts.
pack: mpesa
samples:
  - name: send money to a person
    sender: MPESA
    body: 'TJA0000001 Confirmed. Ksh1,500.00 sent to JANE DOE 0700***001 on 26/10/26 at 9:15 AM. New M-PESA balance is Ksh3,250.00. Transaction cost, Ksh15.00. Amount you can transact within the day is 498,500.00.'
    expect:
      rule: sent
      type: sent
      direction: out
      amount_minor: 150000
      fee_minor: 1500
      balance_minor: 325000
      receipt: TJA0000001
      counterparty: JANE DOE
      account: 0700***001
      time: '2026-10-26T09:15:00+03:00'

  - name: pay a bill
    sender: MPESA
    body: 'TJA0000002 Confirmed. Ksh1,200.00 sent to EXAMPLE POWER LTD for account 1234567890 on 26/10/26 at 11:30 AM New M-PESA balance is Ksh2,035.00. Transaction cost, Ksh15.00.Amount you can transact within the day is 497,300.00.'
    expect:
      rule: paybill
      type: paybill
      direction: out
      amount_minor: 120000
      fee_minor: 1500
      balance_minor: 203500
      receipt: TJA0000002
      counterparty: EXAMPLE POWER LTD
      account: '1234567890'
      time: '2026-10-26T11:30:00+03:00'

  - name: receive money from a person
    sender: MPESA
    body: 'TJA0000003 Confirmed.You have received Ksh2,000.00 from JOHN KAMAU 0700***002 on 26/10/26 at 10:02 AM  New M-PESA balance is Ksh4,035.00.'
    expect:
      rule: received
      type: received
      direction: in
      amount_minor: 200000
      balance_minor: 403500
      receipt: TJA0000003
      counterparty: JOHN KAMAU
      account: 0700***002
      time: '2026-10-26T10:02:00+03:00'

  - name: receive money from an organisation
    sender: MPESA
    body: 'TJA0000010 Confirmed.You have received Ksh5,000.00 from EXAMPLE SACCO on 27/10/26 at 8:05 AM New M-PESA balance is Ksh8,904.50.'
    expect:
      rule: received
      type: received
      direction: in
      amount_minor: 500000
      balance_minor: 890450
      receipt: TJA0000010
      counterparty: EXAMPLE SACCO
      time: '2026-10-27T08:05:00+03:00'

  - name: pay a till
    sender: MPESA
    body: 'TJA0000004 Confirmed. Ksh350.00 paid to EXAMPLE GROCERS. on 26/10/26 at 1:45 PM.New M-PESA balance is Ksh3,685.00. Transaction cost, Ksh0.00. Amount you can transact within the day is 496,950.00.'
    expect:
      rule: till
      type: till
      direction: out
      amount_minor: 35000
      fee_minor: 0
      balance_minor: 368500
      receipt: TJA0000004
      counterparty: EXAMPLE GROCERS
      time: '2026-10-26T13:45:00+03:00'

  - name: withdraw cash at an agent
    sender: MPESA
    body: 'TJA0000005 Confirmed.on 26/10/26 at 5:10 PMWithdraw Ksh1,000.00 from 123456 - EXAMPLE AGENT SHOP NAIROBI New M-PESA balance is Ksh2,656.00. Transaction cost, Ksh29.00.'
    expect:
      rule: withdrawal
      type: withdrawal
      direction: out
      amount_minor: 100000
      fee_minor: 2900
      balance_minor: 265600
      receipt: TJA0000005
      counterparty: EXAMPLE AGENT SHOP NAIROBI
      account: '123456'
      time: '2026-10-26T17:10:00+03:00'

  - name: buy airtime
    sender: MPESA
    body: 'TJA0000006 confirmed.You bought Ksh100.00 of airtime on 26/10/26 at 7:00 PM.New M-PESA balance is Ksh2,556.00. Transaction cost, Ksh0.00.'
    expect:
      rule: airtime
      type: airtime
      direction: out
      amount_minor: 10000
      fee_minor: 0
      balance_minor: 255600
      receipt: TJA0000006
      time: '2026-10-26T19:00:00+03:00'

  - name: Fuliza draw uses the received time
    sender: MPESA
    received_at: '2026-10-26T13:44:58+03:00'
    body: 'TJA0000007 Confirmed. Fuliza M-Pesa amount is Ksh 150.00. Access Fee charged Ksh 1.50. Total Fuliza M-Pesa outstanding amount is Ksh 151.50 due on 25/11/26. To check daily charges, Dial *000*0#OK Select Query Charges'
    expect:
      rule: fuliza
      type: fuliza
      direction: in
      amount_minor: 15000
      fee_minor: 150
      receipt: TJA0000007
      time: '2026-10-26T13:44:58+03:00'

  - name: Fuliza repayment
    sender: MPESA
    received_at: '2026-10-27T08:05:10+03:00'
    body: 'TJA0000008 Confirmed. Ksh 151.50 from your M-PESA has been used to fully pay your outstanding Fuliza M-PESA. Available Fuliza M-PESA limit is Ksh 2,000.00. M-PESA balance is Ksh8,753.00.'
    expect:
      rule: fuliza_repayment
      type: fuliza_repayment
      direction: out
      amount_minor: 15150
      balance_minor: 875300
      receipt: TJA0000008
      time: '2026-10-27T08:05:10+03:00'

  - name: reversal of a send
    sender: MPESA
    body: 'TJA0000009 Confirmed. Reversal of transaction TJA0000001 has been successfully reversed  on 26/10/26 at 8:00 PM and Ksh1,500.00 is credited to your M-PESA account. New M-PESA account balance is Ksh4,056.00.'
    expect:
      rule: reversal
      type: reversal
      direction: in
      amount_minor: 150000
      balance_minor: 405600
      receipt: TJA0000009
      account: TJA0000001
      time: '2026-10-26T20:00:00+03:00'

  - name: service notice goes to the review inbox
    sender: MPESA
    body: 'Dear Customer, M-PESA services will be briefly unavailable tonight from 11:00 PM for planned maintenance.'
    expect: unmatched
