# yaml-language-server: $schema=../../schema/fixtures.schema.json
# Synthetic messages only: fake names, masked fake numbers, made-up receipts.
pack: mpesa
samples:
  - name: send money to a person
    sender: MPESA
    body: 'TJA0000001 Confirmed. Ksh1,500.00 sent to JANE DOE 0700***001 on 26/10/26 at 9:15 AM. New M-PESA balance is Ksh3,250.00. Transaction cost, Ksh15.00. Amount you can transact within the day is 498,500.00.'
    expect:
      rule: sent
      type: sent
      direction: out
      amount_minor: 150000
      fee_minor: 1500
      balance_minor: 325000
      receipt: TJA0000001
      counterparty: JANE DOE
      account: 0700***001
      time: '2026-10-26T09:15:00+03:00'

  - name: pay a bill
    sender: MPESA
    body: 'TJA0000002 Confirmed. Ksh1,200.00 sent to EXAMPLE POWER LTD for account 1234567890 on 26/10/26 at 11:30 AM New M-PESA balance is Ksh2,035.00. Transaction cost, Ksh15.00.Amount you can transact within the day is 497,300.00.'
    expect:
      rule: paybill
      type: paybill
      direction: out
      amount_minor: 120000
      fee_minor: 1500
      balance_minor: 203500
      receipt: TJA0000002
      counterparty: EXAMPLE POWER LTD
      account: '1234567890'
      time: '2026-10-26T11:30:00+03:00'

  - name: receive money from a person
    sender: MPESA
    body: 'TJA0000003 Confirmed.You have received Ksh2,000.00 from JOHN KAMAU 0700***002 on 26/10/26 at 10:02 AM  New M-PESA balance is Ksh4,035.00.'
    expect:
      rule: received
      type: received
      direction: in
      amount_minor: 200000
      balance_minor: 403500
      receipt: TJA0000003
      counterparty: JOHN KAMAU
      account: 0700***002
      time: '2026-10-26T10:02:00+03:00'

  - name: receive money from an organisation
    sender: MPESA
    body: 'TJA0000010 Confirmed.You have received Ksh5,000.00 from EXAMPLE SACCO on 27/10/26 at 8:05 AM New M-PESA balance is Ksh8,904.50.'
    expect:
      rule: received
      type: received
      direction: in
      amount_minor: 500000
      balance_minor: 890450
      receipt: TJA0000010
      counterparty: EXAMPLE SACCO
      time: '2026-10-27T08:05:00+03:00'

  - name: pay a till
    sender: MPESA
    body: 'TJA0000004 Confirmed. Ksh350.00 paid to EXAMPLE GROCERS. on 26/10/26 at 1:45 PM.New M-PESA balance is Ksh3,685.00. Transaction cost, Ksh0.00. Amount you can transact within the day is 496,950.00.'
    expect:
      rule: till
      type: till
      direction: out
      amount_minor: 35000
      fee_minor: 0
      balance_minor: 368500
      receipt: TJA0000004
      counterparty: EXAMPLE GROCERS
      time: '2026-10-26T13:45:00+03:00'

  - name: withdraw cash at an agent
    sender: MPESA
    body: 'TJA0000005 Confirmed.on 26/10/26 at 5:10 PMWithdraw Ksh1,000.00 from 123456 - EXAMPLE AGENT SHOP NAIROBI New M-PESA balance is Ksh2,656.00. Transaction cost, Ksh29.00.'
    expect:
      rule: withdrawal
      type: withdrawal
      direction: out
      amount_minor: 100000
      fee_minor: 2900
      balance_minor: 265600
      receipt: TJA0000005
      counterparty: EXAMPLE AGENT SHOP NAIROBI
      account: '123456'
      time: '2026-10-26T17:10:00+03:00'

  - name: buy airtime
    sender: MPESA
    body: 'TJA0000006 confirmed.You bought Ksh100.00 of airtime on 26/10/26 at 7:00 PM.New M-PESA balance is Ksh2,556.00. Transaction cost, Ksh0.00.'
    expect:
      rule: airtime
      type: airtime
      direction: out
      amount_minor: 10000
      fee_minor: 0
      balance_minor: 255600
      receipt: TJA0000006
      time: '2026-10-26T19:00:00+03:00'

  - name: Fuliza draw uses the received time
    sender: MPESA
    received_at: '2026-10-26T13:44:58+03:00'
    body: 'TJA0000007 Confirmed. Fuliza M-Pesa amount is Ksh 150.00. Access Fee charged Ksh 1.50. Total Fuliza M-Pesa outstanding amount is Ksh 151.50 due on 25/11/26. To check daily charges, Dial *000*0#OK Select Query Charges'
    expect:
      rule: fuliza
      type: fuliza
      direction: in
      amount_minor: 15000
      fee_minor: 150
      receipt: TJA0000007
      time: '2026-10-26T13:44:58+03:00'

  - name: Fuliza repayment
    sender: MPESA
    received_at: '2026-10-27T08:05:10+03:00'
    body: 'TJA0000008 Confirmed. Ksh 151.50 from your M-PESA has been used to fully pay your outstanding Fuliza M-PESA. Available Fuliza M-PESA limit is Ksh 2,000.00. M-PESA balance is Ksh8,753.00.'
    expect:
      rule: fuliza_repayment
      type: fuliza_repayment
      direction: out
      amount_minor: 15150
      balance_minor: 875300
      receipt: TJA0000008
      time: '2026-10-27T08:05:10+03:00'

  - name: reversal of a send
    sender: MPESA
    body: 'TJA0000009 Confirmed. Reversal of transaction TJA0000001 has been successfully reversed  on 26/10/26 at 8:00 PM and Ksh1,500.00 is credited to your M-PESA account. New M-PESA account balance is Ksh4,056.00.'
    expect:
      rule: reversal
      type: reversal
      direction: in
      amount_minor: 150000
      balance_minor: 405600
      receipt: TJA0000009
      account: TJA0000001
      time: '2026-10-26T20:00:00+03:00'

  - name: send with two spaces in the name and no phone
    sender: MPESA
    body: 'TJA0000010 Confirmed. Ksh300.00 sent to MARY  ATIENO on 26/10/26 at 9:20 AM. New M-PESA balance is Ksh2,950.00. Transaction cost, Ksh0.00. Amount you can transact within the day is 498,200.00.'
    expect:
      rule: sent
      type: sent
      direction: out
      amount_minor: 30000
      fee_minor: 0
      balance_minor: 295000
      receipt: TJA0000010
      counterparty: MARY ATIENO
      time: '2026-10-26T09:20:00+03:00'

  - name: receive from a bank with its short code
    sender: MPESA
    body: 'TJA0000011 Confirmed.You have received Ksh5,000.00 from EXAMPLE BANK 1 522522 on 26/10/26 at 10:10 AM New M-PESA balance is Ksh9,035.00.  Separate personal and business funds through Pochi la Biashara on *334#.'
    expect:
      rule: received
      type: received
      direction: in
      amount_minor: 500000
      balance_minor: 903500
      receipt: TJA0000011
      counterparty: EXAMPLE BANK 1
      account: '522522'
      time: '2026-10-26T10:10:00+03:00'

  - name: receive with a greeting before the receipt
    sender: MPESA
    body: 'Congratulations! TJA0000012 confirmed.You have received Ksh800.00 from EXAMPLE WALLET B2C. on 26/10/26 at 10:15 AM.New M-PESA balance is Ksh9,835.00.'
    expect:
      rule: received
      type: received
      direction: in
      amount_minor: 80000
      balance_minor: 983500
      receipt: TJA0000012
      counterparty: EXAMPLE WALLET B2C
      time: '2026-10-26T10:15:00+03:00'

  - name: deposit cash at an agent
    sender: MPESA
    body: 'TJA0000013 Confirmed. On 26/10/26 at 2:30 PM Give Ksh2,000.00 cash to EXAMPLE AGENT SHOP New M-PESA balance is Ksh10,806.00.'
    expect:
      rule: deposit
      type: received
      direction: in
      amount_minor: 200000
      balance_minor: 1080600
      receipt: TJA0000013
      counterparty: EXAMPLE AGENT SHOP
      time: '2026-10-26T14:30:00+03:00'

  - name: buy airtime for another number
    sender: MPESA
    body: 'TJA0000014 Confirmed.Ksh50.00 of airtime for 0700000003 on 26/10/26 at 3:05 PM  New M-PESA balance is Ksh10,656.00.'
    expect:
      rule: airtime_other
      type: airtime
      direction: out
      amount_minor: 5000
      balance_minor: 1065600
      receipt: TJA0000014
      account: '0700000003'
      time: '2026-10-26T15:05:00+03:00'

  - name: Fuliza draw in capitals
    sender: MPESA
    received_at: '2026-10-26T15:10:00+03:00'
    body: 'TJA0000015 Confirmed. Fuliza M-PESA amount is Ksh 250.00. Access Fee charged Ksh 2.50. Total Fuliza M-PESA outstanding amount is Ksh 1794.51 due on 25/11/26. To check daily charges, Dial *334#OK Select Fuliza M-PESA to Query Charges.'
    expect:
      rule: fuliza
      type: fuliza
      direction: in
      amount_minor: 25000
      fee_minor: 250
      receipt: TJA0000015
      time: '2026-10-26T15:10:00+03:00'

  - name: move to M-Shwari
    sender: MPESA
    body: 'TJA0000016 Confirmed.Ksh500.00 transferred to M-Shwari account on 26/10/26 at 4:00 PM. M-PESA balance is Ksh247.50 .New M-Shwari saving account balance is Ksh1,500.00. Transaction cost Ksh.0.00'
    expect:
      rule: mshwari_deposit
      type: paybill
      direction: out
      amount_minor: 50000
      fee_minor: 0
      balance_minor: 24750
      receipt: TJA0000016
      counterparty: M-Shwari
      time: '2026-10-26T16:00:00+03:00'

  - name: move from M-Shwari
    sender: MPESA
    body: 'TJA0000017 Confirmed.Ksh200.00 transferred from M-Shwari account on 26/10/26 at 4:10 PM. M-Shwari balance is Ksh1,300.00 .M-PESA balance is Ksh447.50 .Transaction cost Ksh.0.00'
    expect:
      rule: mshwari_withdraw
      type: received
      direction: in
      amount_minor: 20000
      fee_minor: 0
      balance_minor: 44750
      receipt: TJA0000017
      counterparty: M-Shwari
      time: '2026-10-26T16:10:00+03:00'

  - name: reversal taken back from the recipient
    sender: MPESA
    body: 'TJA0000018  confirmed. Reversal of transaction TJA0000011 has been successfully reversed  on 26/10/26  at 5:00 PM and Ksh300.00 is debited from your M-PESA account. New M-PESA account balance is Ksh147.50.'
    expect:
      rule: reversal
      type: reversal
      direction: out
      amount_minor: 30000
      balance_minor: 14750
      receipt: TJA0000018
      account: TJA0000011
      time: '2026-10-26T17:00:00+03:00'

  - name: M-Shwari balance goes to the review inbox
    sender: MPESA
    body: 'TJA0000019 Confirmed . Your M-Shwari Deposit Account balance is Ksh1,300.00 .Transaction cost Ksh 0.00.'
    expect: unmatched

  - name: service notice goes to the review inbox
    sender: MPESA
    body: 'Dear Customer, M-PESA services will be briefly unavailable tonight from 11:00 PM for planned maintenance.'
    expect: unmatched
