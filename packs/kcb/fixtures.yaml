# yaml-language-server: $schema=../../schema/fixtures.schema.json
# Synthetic messages only.
pack: kcb
samples:
  - name: repay a salary advance from the KCB account
    sender: KCB
    received_at: '2026-11-05T19:40:00+03:00'
    body: 'Dear JANE AKINYI DOE, KES 12000.00 was debited from your KCB account to repay your KCB Salary Advance 100000001. The loan has been partially paid. Your loan balance is KES 48500.25, next instalment is due on 15/12/2026. Pay the loan to borrow again.'
    expect:
      rule: loan_repayment
      type: loan_repayment
      direction: out
      amount_minor: 1200000
      counterparty: KCB Salary Advance
      account: '100000001'
      owed_minor: 4850025
      due: '2026-12-15T00:00:00+03:00'
      time: '2026-11-05T19:40:00+03:00'

  - name: money in through KCB Mobi, such as from M-Pesa paybill
    sender: KCB
    body: 'Dear Customer, your acc 1234567890 has been credited KES 12,000.00 Mobi at KCB DATA PROCESSING CENTRE at 19:45:10 on 05 NOV 2026. For any queries call KCB on  +254700000000'
    expect:
      rule: mobi_credit
      type: bank
      direction: in
      amount_minor: 1200000
      own_account: '1234567890'
      time: '2026-11-05T19:45:10+03:00'

  - name: M-Pesa paid to KCB paybill, confirmed by KCB
    sender: KCB
    body: 'Ksh 12000.00 sent to KCB Pay Bill 522522 for account 123***7890 JANE AKINYI DOE has been received on 05/11/2026 at 07:45 PM. M-PESA ref TJA0000020. To reverse this transaction, SMS this message to 16120'
    expect:
      rule: mpesa_paybill
      type: paybill
      direction: out
      institution: mpesa
      amount_minor: 1200000
      receipt: TJA0000020
      counterparty: KCB
      account: 123***7890
      time: '2026-11-05T19:45:00+03:00'

  - name: money from someone's KCB account into M-Pesa
    sender: KCB
    body: 'KCB0000000000021 Confirmed.  KES 2,500.00 received from MARY WAMBUI DOE - 987****654 on 2026-11-07 03:15:20 PM via KCB.'
    expect:
      rule: mpesa_received
      type: received
      direction: in
      institution: mpesa
      amount_minor: 250000
      receipt: KCB0000000000021
      counterparty: MARY WAMBUI DOE
      account: 987****654
      time: '2026-11-07T15:15:20+03:00'

  - name: account debited
    sender: KCB
    body: 'Dear Customer, KES 3,000.00 has been debited from your account ****0001 on 26/10/2026 at 15:20. Transaction Ref: KCB0000000001. Your available balance is KES 7,000.00.'
    expect:
      rule: account_alert
      type: bank
      direction: out
      amount_minor: 300000
      balance_minor: 700000
      receipt: KCB0000000001
      own_account: '****0001'
      time: '2026-10-26T15:20:00+03:00'

  - name: account credited
    sender: KCB
    body: 'Dear Customer, KES 12,500.50 has been credited to your account ****0001 on 27/10/2026 at 09:00. Transaction Ref: KCB0000000002. Your available balance is KES 19,500.50.'
    expect:
      rule: account_alert
      type: bank
      direction: in
      amount_minor: 1250050
      balance_minor: 1950050
      receipt: KCB0000000002
      own_account: '****0001'
      time: '2026-10-27T09:00:00+03:00'

  - name: USD account debited
    sender: KCB
    body: 'Dear Customer, USD 250.00 has been debited from your account ****0002 on 03/11/2026 at 10:15. Transaction Ref: KCB0000000009. Your available balance is USD 1,250.00.'
    expect:
      rule: account_alert
      type: bank
      direction: out
      amount_minor: 25000
      balance_minor: 125000
      currency: USD
      receipt: KCB0000000009
      own_account: '****0002'
      time: '2026-11-03T10:15:00+03:00'

  - name: send to a mobile wallet
    sender: KCB
    body: 'KCB0000000000003  KES 1,000.00 sent from 123****456 to 254****789 - JANE DOE on 2026-10-26 09:15:00 AM. M-PESA REF: TJA0000001'
    expect:
      rule: wallet_transfer
      type: bank
      direction: out
      amount_minor: 100000
      receipt: KCB0000000000003
      counterparty: JANE DOE
      own_account: 123****456
      time: '2026-10-26T09:15:00+03:00'

  - name: named account credited
    sender: KCB
    body: 'Dear JANE, your KCB A/C ****1234 has been credited with KES 2,000.00 from JOHN KAMAU on 26/10/2026 at 9:15 PM. Ref: KCB0000000004. Avail Bal KES 9,000.00'
    expect:
      rule: account_named
      type: bank
      direction: in
      amount_minor: 200000
      balance_minor: 900000
      receipt: KCB0000000004
      counterparty: JOHN KAMAU
      own_account: '****1234'
      time: '2026-10-26T21:15:00+03:00'

  - name: balance enquiry goes to the review inbox
    sender: KCB
    body: 'Dear Customer, your account balance is KES 19,500.50 as at 27/10/2026 10:00.'
    expect: unmatched
