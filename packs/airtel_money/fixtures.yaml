# yaml-language-server: $schema=../../schema/fixtures.schema.json
# Synthetic messages only.
pack: airtel_money
samples:
  # The twin of the mpesa pack's send to AIRTEL MONEY (TJA0000037).
  - name: receive money from M-Pesa, with the sender's reference
    sender: AirtelMoney
    body: 'TID:TJA0000040. Received Ksh 100 from JOHN KAMAU DOE 254711000000 on 14/11/26 03:00 PM. Bal:Ksh 220.0 Sender TID:TJA0000037.'
    expect:
      rule: received
      type: received
      direction: in
      amount_minor: 10000
      balance_minor: 22000
      receipt: TJA0000040
      counterparty: JOHN KAMAU DOE
      account: TJA0000037
      time: '2026-11-14T15:00:00+03:00'

  - name: buy a bundle
    sender: AirtelMoney
    body: '10000000001 Confirmed. Bundle purchase successful of Ksh 20 via Airtel Networks Kenya Ltd on 15/11/26 at 06:01 PM. Bal: Ksh 0.0.'
    expect:
      rule: bundle
      type: airtime
      direction: out
      amount_minor: 2000
      balance_minor: 0
      receipt: '10000000001'
      counterparty: Airtel Networks Kenya Ltd
      time: '2026-11-15T18:01:00+03:00'

  - name: an unknown alert goes to the review inbox
    sender: AirtelMoney
    body: 'Example alert: Ksh 500.00 sent to JANE DOE 0700000001 on 26/10/2026 at 09:15. Balance Ksh 1,500.00. TID EX0000000001.'
    expect: unmatched

  - name: the sender is matched in any case
    sender: AIRTELMONEY
    body: 'Example alert: Ksh 1,000.00 received from JOHN KAMAU 0700000002 on 26/10/2026 at 10:02. Balance Ksh 2,500.00. TID EX0000000002.'
    expect: unmatched

  - name: a promotion goes to the review inbox
    sender: AirtelMoney
    body: 'Get 2GB Data Bundle for Ksh 50 only today! Dial *000# to buy.'
    expect: unmatched
