name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Format, analyse, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyse
        run: dart analyze --fatal-infos
      - name: Check packs
        run: dart run tool/check_packs.dart
      - name: Test
        run: dart test

  schema:
    name: Packs match the JSON Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.38.2
      - run: check-jsonschema --schemafile schema/pack.schema.json packs/*/pack.yaml
      - run: check-jsonschema --schemafile schema/fixtures.schema.json packs/*/fixtures.yaml
